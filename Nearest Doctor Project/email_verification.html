<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="email_verification.css">
    <link rel="icon" href="img/ddnd logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .content {
            transition: filter 0.3s ease; 
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            border-radius: 15px;
            width: 350px;
        } 

        .cm {
            width: 40px;
            padding-top: 10px;
        }

        .verified {
            font-size: 13px;
            padding-top: 20px;
        }

        .popup p {
            margin-bottom: 20px;
            font-size: 17px;
            padding-top: 10px;
            color: black;
        }

        #closePopup {
            padding: 5px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #e70a02;
            color: white;
            border-radius: 15px;
            border: none;
        }

        #closePopup:hover {
            background-color: #f5261e;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 1000;
        }
    </style>

</head>
<body>

    
    <div class="diagonal-split"></div>
    
    <div class="gradient-overlay">
        <!-- <nav>
            
            <a href="landing-page.html"><img src="img/ddnd logo.png" alt="" class="logo1"></a>
        
            <ul>
                <a href="landing-page.html"><li>Home</li></a>
                <a href="landing-page.html#about-us"><li>About</li></a>
                <a href="landing-page.html#services"><li>Services</li></a>
                <a href=""><li>Pricing</li></a>
                <a href=""><li>Contact us</li></a>
            </ul>
    
            <a href="login.html"><button class="login-button">Login</button></a>
            <button class="register-button">Register</button>
    
        </nav> -->
        <div class="border1">
            <div class="image-container">
                <img src="img/doctor.jpeg" alt="Doctor" class="doctor">
            </div>
           
            <div class="form-container">
                <a href=""><img src="img/ddnd logo.png" alt="Logo" class="logo"></a>
                <h2>Email Verification</h2>
                <p>Please enter the 4-digit code sent to <br> <strong>lucycynthia@gmail.com</strong></p>
                <div class="code-inputs">
                    
                    <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp2')" id="otp1">
                    <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp3')" id="otp2">
                    <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp4')" id="otp3">
                    <input type="text" maxlength="1" onkeyup="moveToNext(this, '')" id="otp4">
                </div>
                
                <div class="content">
                    <button id="popupBtn">Verify</button>
                </div>

                <div id="overlay" class="overlay"></div>

                <div id="popupMessage" class="popup">
                    <img src="img/check mark.png" alt="" class="cm">
                    <div class="verified"><h1>Verified</h1></div> 
                    <div class="success"><p><strong>Lucy!</strong> You have successfully verified <br> your account</p></div>
                    <button id="closePopup">Close</button>
                </div>

                <a href="#" class="resend-code">Resend Code</a>
            
            </div>
        </div>
    </div>

    <script>
        const popupBtn = document.getElementById('popupBtn');
        const popupMessage = document.getElementById('popupMessage');
        const closePopup = document.getElementById('closePopup');
        const content = document.querySelector('.content');
        const overlay = document.getElementById('overlay');

        popupBtn.addEventListener('click', function() {
            popupMessage.style.display = 'block';
            overlay.style.display = 'block';  // Show the dark overlay
            content.classList.add('blur-background');  // Apply blur to the background
        });

        closePopup.addEventListener('click', function() {
            popupMessage.style.display = 'none';
            overlay.style.display = 'none';  // Hide the dark overlay
            content.classList.remove('blur-background');  // Remove blur when popup is closed
        });

        // moveToNext function for automatic input focus
        function moveToNext(current, nextFieldID) {
            if (current.value.length === current.maxLength) {
                if (nextFieldID) {
                    document.getElementById(nextFieldID).focus();
                }
            }
        }
    </script>
</body>
</html>
